<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>emberry · brand previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500&family=Plus+Jakarta+Sans:wght@400;500&family=Poiret+One&display=swap" rel="stylesheet">
<style>
  :root{--plum:#2D1F36;--cream:#FAF6F0;--muted:#6E5E72;--ember:#F2542D;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--plum);
    background:radial-gradient(900px 500px at 50% -10%,#F3EEF4,transparent 60%),
      linear-gradient(160deg,#E7E4EC,#EFEAEF 50%,#E9E6EE);}
  .card{text-align:center;padding:40px 28px;max-width:440px}
  .wordmark{font-family:"Poiret One";font-size:34px;letter-spacing:.01em;text-transform:lowercase;line-height:1}
  .wordmark .e{color:var(--ember)}
  h1{font-family:"Lora",serif;font-style:italic;font-weight:500;letter-spacing:-.02em;
    font-size:26px;margin:22px 0 12px}
  p{font-size:14.5px;line-height:1.6;color:var(--muted);margin:0 auto;max-width:360px}
  a{color:var(--ember);text-decoration:none;font-weight:600}
  .mark{margin-bottom:6px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="40" height="40" viewBox="0 -4.07 120 120"><circle cx="43.5" cy="46.5" r="13.9" fill="#E14A6E"/><circle cx="60.2" cy="44.2" r="14.6" fill="#C42348"/><circle cx="76.4" cy="47" r="13.1" fill="#E14A6E"/><circle cx="50.8" cy="61.5" r="13.3" fill="#A81C3C"/><circle cx="69.4" cy="62.2" r="13.8" fill="#C42348"/><circle cx="60.3" cy="77" r="13.2" fill="#A81C3C"/></svg>
    </div>
    <div class="wordmark"><span class="e">e</span>mberry</div>
    <h1>Brand previews.</h1>
    <p>Preview links are shared individually. If you were sent one, use that link directly.
       Learn more at <a href="https://emberry.com.au">emberry.com.au</a>.</p>
  </div>
</body>
</html>
